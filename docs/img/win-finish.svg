<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" font-family="'Microsoft JhengHei UI','Microsoft JhengHei','PingFang TC','Noto Sans TC','Noto Sans CJK TC',sans-serif">
  <title>安裝完成頁：「下載語言模型」預設打勾，按「完成」（示意圖）</title>
  <defs>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6FB7"/>
      <stop offset="1" stop-color="#173F73"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" rx="16" fill="#E9EDF2"/>

  <!-- window -->
  <rect x="40" y="24" width="520" height="400" fill="#fff" stroke="#9AA4B2"/>
  <rect x="40" y="24" width="520" height="30" fill="#fff"/>
  <rect x="50" y="32" width="16" height="16" rx="3" fill="#4A90D9"/>
  <text x="58" y="45" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">島</text>
  <text x="74" y="44" font-size="12" fill="#1F1F1F">島輝 0.17.4.15 安裝</text>
  <text x="540" y="44" font-size="13" fill="#1F1F1F" text-anchor="middle">✕</text>
  <line x1="40" y1="54" x2="560" y2="54" stroke="#E1E4E8"/>

  <rect x="40" y="55" width="164" height="313" fill="url(#side)"/>
  <rect x="82" y="150" width="80" height="80" rx="16" fill="#fff" fill-opacity="0.15"/>
  <text x="122" y="206" font-size="48" font-weight="700" fill="#fff" text-anchor="middle">島</text>

  <text x="222" y="92" font-size="16" font-weight="700" fill="#1F1F1F">即將完成安裝 島輝 0.17.4.15</text>
  <text font-size="12.5" fill="#1F1F1F">
    <tspan x="222" y="126">島輝已經安裝好了，不需要重新開機。</tspan>
    <tspan x="222" y="156">• 切換輸入法：按 Windows 鍵＋空白鍵，選「島輝」。</tspan>
    <tspan x="222" y="178">• 中文／英文切換：連按兩下 Shift。</tspan>
    <tspan x="222" y="200">• 已經開著的程式要關掉再打開，才會用到島輝。</tspan>
  </text>

  <!-- checkbox -->
  <rect x="222" y="236" width="14" height="14" rx="2" fill="#0B6BCB"/>
  <path d="M225 243 L228.5 246.5 L234 239.5" fill="none" stroke="#fff" stroke-width="2"/>
  <text font-size="12.5" fill="#1F1F1F">
    <tspan x="244" y="248">下載語言模型（約 410 MB，讓整句選字</tspan>
    <tspan x="244" y="268">更準確）</tspan>
  </text>
  <rect x="214" y="228" width="268" height="48" rx="8" fill="none" stroke="#2F80ED" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect x="300" y="286" width="226" height="44" rx="10" fill="#2F80ED"/>
  <text font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">
    <tspan x="413" y="304">預設已經打勾：按「完成」後</tspan>
    <tspan x="413" y="322">會自動下載，下載完自動套用</tspan>
  </text>

  <!-- buttons -->
  <rect x="40" y="368" width="520" height="56" fill="#F0F0F0"/>
  <line x1="40" y1="368" x2="560" y2="368" stroke="#D0D4DA"/>
  <rect x="290" y="382" width="80" height="26" fill="#F5F5F5" stroke="#C8C8C8"/>
  <text x="330" y="400" font-size="12.5" fill="#A0A0A0" text-anchor="middle">&lt; 上一步</text>
  <rect x="378" y="382" width="80" height="26" fill="#E1EEFB" stroke="#0B6BCB"/>
  <text x="418" y="400" font-size="12.5" fill="#1F1F1F" text-anchor="middle">完成(F)</text>
  <rect x="466" y="382" width="80" height="26" fill="#F5F5F5" stroke="#C8C8C8"/>
  <text x="506" y="400" font-size="12.5" fill="#A0A0A0" text-anchor="middle">取消</text>
  <rect x="371" y="375" width="94" height="40" rx="8" fill="none" stroke="#FF4D4F" stroke-width="3"/>
  <rect x="226" y="341" width="128" height="24" rx="12" fill="#E5484D"/>
  <text x="290" y="358" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">最後按「完成」</text>
  <path d="M354 353 L392 353 L392 372" fill="none" stroke="#E5484D" stroke-width="2.5"/>

  <text x="584" y="440" font-size="11" fill="#6B7280" text-anchor="end">示意圖</text>
</svg>
