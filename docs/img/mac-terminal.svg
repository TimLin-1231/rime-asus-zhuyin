<svg xmlns="http://www.w3.org/2000/svg" width="840" height="560" viewBox="0 0 840 560" font-family="-apple-system,'PingFang TC','Helvetica Neue','Microsoft JhengHei UI','Microsoft JhengHei','Noto Sans TC',sans-serif">
  <title>在終端機貼上一行指令，看到「✔ 島輝裝好了」就完成（示意圖）</title>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9C6E4"/>
      <stop offset="1" stop-color="#D9C9E6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F2937" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="840" height="560" rx="16" fill="url(#desk)"/>

  <g filter="url(#shadow)">
    <rect x="24" y="24" width="792" height="500" rx="10" fill="#fff"/>
  </g>
  <path d="M24 34 a10 10 0 0 1 10 -10 h772 a10 10 0 0 1 10 10 v20 h-792 z" fill="#ECECEC"/>
  <line x1="24" y1="54" x2="816" y2="54" stroke="#D4D4D4"/>
  <circle cx="44" cy="39" r="6" fill="#FF5F57"/>
  <circle cx="64" cy="39" r="6" fill="#FEBC2E"/>
  <circle cx="84" cy="39" r="6" fill="#28C840"/>
  <text x="420" y="44" font-size="13" fill="#4B5563" text-anchor="middle">終端機 — -zsh — 80×24</text>

  <g font-family="'SF Mono',Menlo,Monaco,Consolas,'PingFang TC','Microsoft JhengHei',monospace" font-size="13" fill="#1F2328">
    <text x="40" y="80">% curl -fsSL https://raw.githubusercontent.com/TimLin-1231/rime-asus-zhuyin/main</text>
    <text x="40" y="98">/install/mac.sh | bash</text>
    <text x="40" y="124">【島輝】輸入法 安裝程式</text>
    <text x="40" y="142">▶ 查詢最新版本</text>
    <text x="56" y="160">最新版是 1.1.2.24。</text>
    <text x="40" y="178">▶ 下載島輝 1.1.2.24</text>
    <text x="40" y="196">############################################################ 100.0%</text>
    <text x="40" y="214">▶ 安裝到 ~/Library/Input Methods</text>
    <text x="56" y="232">完成。</text>
    <text x="40" y="250">▶ 加入並選用「島輝」輸入法</text>
    <text x="56" y="268">已經切換到島輝。</text>
    <text x="40" y="286">▶ 語言模型（讓整句選字更準，約 410 MB）</text>
    <text x="40" y="304">############################################################ 100.0%</text>
    <text x="56" y="322">完成。</text>
    <text x="40" y="358" font-weight="700" fill="#1A7F37">✔ 島輝裝好了（版本 1.1.2.24）。</text>
    <text x="40" y="394">怎麼開始用：</text>
    <text x="56" y="412">• 現在就可以打字了。螢幕右上角選單列的輸入法圖示會是「島」。</text>
    <text x="56" y="430">• 切換輸入法：按 🌐（fn）鍵或 Control＋空白鍵。</text>
    <text x="56" y="448">• 中文／英文切換：連按兩下 Shift。</text>
    <text x="56" y="466">• 以後島輝會在背景自動更新，不用再執行這個指令。</text>
    <text x="40" y="502">%</text>
  </g>

  <rect x="32" y="64" width="776" height="42" rx="7" fill="none" stroke="#FF4D4F" stroke-width="3"/>
  <rect x="584" y="104" width="216" height="26" rx="13" fill="#E5484D"/>
  <text x="692" y="122" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1  貼上這一行，按 return</text>

  <rect x="32" y="340" width="300" height="28" rx="7" fill="none" stroke="#1A7F37" stroke-width="3"/>
  <rect x="344" y="341" width="200" height="26" rx="13" fill="#1A7F37"/>
  <text x="444" y="359" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2  看到這行就裝好了</text>

  <text x="824" y="548" font-size="11" fill="#4B5563" text-anchor="end">示意圖</text>
</svg>
