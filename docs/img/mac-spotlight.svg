<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" font-family="-apple-system,'PingFang TC','Helvetica Neue','Microsoft JhengHei UI','Microsoft JhengHei','Noto Sans TC',sans-serif">
  <title>按 ⌘＋空白鍵，輸入「終端機」，按 return（示意圖）</title>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9C6E4"/>
      <stop offset="1" stop-color="#D9C9E6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1F2937" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="680" height="340" rx="16" fill="url(#desk)"/>

  <!-- keys -->
  <rect x="40" y="28" width="56" height="44" rx="8" fill="#fff" stroke="#9AA4B2" stroke-width="1.5"/>
  <text x="68" y="58" font-size="20" fill="#1F2328" text-anchor="middle">⌘</text>
  <text x="108" y="58" font-size="20" fill="#1F2328">＋</text>
  <rect x="136" y="28" width="150" height="44" rx="8" fill="#fff" stroke="#9AA4B2" stroke-width="1.5"/>
  <text x="211" y="56" font-size="15" fill="#1F2328" text-anchor="middle">空白鍵</text>
  <text x="306" y="56" font-size="15" fill="#1F2328">打開 Spotlight 搜尋</text>

  <!-- spotlight -->
  <g filter="url(#shadow)">
    <rect x="90" y="100" width="500" height="196" rx="14" fill="#F7F7F8"/>
  </g>
  <circle cx="122" cy="130" r="9" fill="none" stroke="#6B7280" stroke-width="2.2"/>
  <path d="M129 137 L136 144" stroke="#6B7280" stroke-width="2.4" stroke-linecap="round"/>
  <text x="148" y="140" font-size="22" fill="#111827">終端機</text>
  <rect x="216" y="118" width="2" height="28" fill="#2F80ED"/>
  <line x1="90" y1="162" x2="590" y2="162" stroke="#E2E4E8"/>
  <text x="110" y="186" font-size="12" font-weight="700" fill="#6B7280">首選</text>
  <rect x="100" y="196" width="480" height="48" rx="8" fill="#2F80ED"/>
  <rect x="112" y="204" width="32" height="32" rx="7" fill="#1F2328"/>
  <text x="128" y="225" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" font-family="Menlo,Consolas,monospace">&gt;_</text>
  <text x="156" y="226" font-size="16" fill="#fff">終端機</text>
  <text x="566" y="226" font-size="13" fill="#DCE9FF" text-anchor="end">應用程式</text>
  <text x="110" y="276" font-size="13" fill="#6B7280">輸入「終端機」（英文系統是 Terminal），按 return 打開</text>
  <rect x="94" y="190" width="492" height="60" rx="10" fill="none" stroke="#FF4D4F" stroke-width="3"/>

  <text x="664" y="328" font-size="11" fill="#4B5563" text-anchor="end">示意圖</text>
</svg>
