<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" font-family="-apple-system,'PingFang TC','Helvetica Neue','Microsoft JhengHei UI','Microsoft JhengHei','Noto Sans TC',sans-serif">
  <title>螢幕右上角的輸入法圖示是「島」，就是在用島輝（示意圖）</title>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9C6E4"/>
      <stop offset="1" stop-color="#D9C9E6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F2937" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="680" height="330" rx="16" fill="url(#desk)"/>

  <!-- menu bar -->
  <path d="M0 16 a16 16 0 0 1 16 -16 h648 a16 16 0 0 1 16 16 v20 h-680 z" fill="#F4F4F6" fill-opacity="0.92"/>
  <text x="24" y="24" font-size="13" font-weight="700" fill="#1F2328">備忘錄</text>
  <text x="84" y="24" font-size="13" fill="#1F2328">檔案　編輯　格式　顯示方式　視窗　輔助說明</text>

  <rect x="398" y="7" width="22" height="22" rx="5" fill="#1F2328"/>
  <text x="409" y="24" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">島</text>
  <path d="M440 22 q9 -9 18 0 M444 25 q5 -5 10 0" fill="none" stroke="#1F2328" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="449" cy="27" r="1.6" fill="#1F2328"/>
  <rect x="470" y="12" width="24" height="12" rx="3" fill="none" stroke="#1F2328" stroke-width="1.4"/>
  <rect x="472" y="14" width="16" height="8" rx="1.5" fill="#1F2328"/>
  <rect x="495" y="16" width="2" height="4" rx="1" fill="#1F2328"/>
  <text x="664" y="24" font-size="13" fill="#1F2328" text-anchor="end">11月2日 週一 下午3:00</text>
  <rect x="392" y="3" width="34" height="30" rx="7" fill="none" stroke="#FF4D4F" stroke-width="3"/>

  <!-- input menu -->
  <g filter="url(#shadow)">
    <rect x="396" y="42" width="250" height="192" rx="10" fill="#F7F7F8"/>
  </g>
  <rect x="402" y="50" width="238" height="30" rx="6" fill="#2F80ED"/>
  <text x="414" y="70" font-size="13" fill="#fff">✓</text>
  <rect x="432" y="56" width="18" height="18" rx="4" fill="#fff"/>
  <text x="441" y="70" font-size="12" font-weight="700" fill="#2F80ED" text-anchor="middle">島</text>
  <text x="460" y="70" font-size="13" fill="#fff">島輝</text>
  <rect x="432" y="88" width="18" height="18" rx="4" fill="none" stroke="#1F2328" stroke-width="1.2"/>
  <text x="441" y="102" font-size="12" font-weight="700" fill="#1F2328" text-anchor="middle">A</text>
  <text x="460" y="102" font-size="13" fill="#1F2328">ABC</text>
  <line x1="408" y1="118" x2="634" y2="118" stroke="#DADCE0"/>
  <text x="414" y="140" font-size="13" fill="#1F2328">顯示表情符號與符號</text>
  <text x="414" y="166" font-size="13" fill="#1F2328">顯示鍵盤檢視器</text>
  <line x1="408" y1="182" x2="634" y2="182" stroke="#DADCE0"/>
  <text x="414" y="206" font-size="13" fill="#1F2328">打開鍵盤設定…</text>

  <text font-size="14" fill="#1F2328">
    <tspan x="40" y="96" font-weight="700" font-size="16">裝好後看右上角</tspan>
    <tspan x="40" y="130">選單列的輸入法圖示是「島」，</tspan>
    <tspan x="40" y="152">就是在用島輝。</tspan>
    <tspan x="40" y="186">點這個圖示可以換回 ABC 等</tspan>
    <tspan x="40" y="208">其他輸入法，也可以按 🌐（fn）。</tspan>
    <tspan x="40" y="250">中文／英文切換：連按兩下 Shift。</tspan>
  </text>

  <text x="664" y="318" font-size="11" fill="#4B5563" text-anchor="end">示意圖</text>
</svg>
