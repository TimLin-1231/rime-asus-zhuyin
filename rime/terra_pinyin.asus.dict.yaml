# Rime dictionary
# encoding: utf-8
#
# terra_pinyin plus a Taiwan supplement and the personal vocabulary.
# The "terra_pinyin." prefix keeps learned data in terra_pinyin.userdb
# (librime: {dictionary: x.y} implies {user_dict: x}).
# Regenerate the imported tables with: python tools/build_lexicon.py

---
name: terra_pinyin.asus
version: "1"
sort: by_weight
use_preset_vocabulary: true
max_phrase_length: 7
min_phrase_weight: 100
import_tables:
  - terra_pinyin
  - terra_pinyin.tw
  - terra_pinyin.personal
...
