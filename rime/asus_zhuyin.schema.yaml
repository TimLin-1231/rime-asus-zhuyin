# Rime schema
# encoding: utf-8
#
# ASUS-style Zhuyin, built on the stock bopomofo_tw schema (standard Dachen
# layout, octagram via grammar:/hant). Dictionary terra_pinyin.asus keeps
# learned data in terra_pinyin.userdb.

__include: bopomofo_tw.schema:/

schema:
  schema_id: asus_zhuyin
  name: 華碩風注音
  version: "0.2.0"
  author:
    - TimLin-1231
  description: |
    華碩智慧輸入法風格的注音方案（大千式鍵盤、臺灣字形）。
    行內預覽首選、精簡候選泡泡；↓ 展開候選、1–9 選字。
    連按兩下 Shift 或 Ctrl+Space 切換中英。
    ` 符號小鍵盤；Ctrl+標點直接輸出全形標點；注音縮寫快捷文字本。
  dependencies: []

engine:
  processors:
    - lua_processor@*asus_shift  # double-tap Shift; must see every key, so first
    - lua_processor@*asus_learn*processor  # Shift/Ctrl+Delete forgets; learns on commit
    - lua_processor@*asus_english*processor  # English mode: words with guesses
    - lua_processor@*asus_email*processor  # Tab types a remembered email address
    - lua_processor@*asus_predict*processor  # next-word prediction, Tab autocomplete
    - lua_processor@*asus_symbols*processor  # ` symbol keyboard, Ctrl+punctuation
    - lua_processor@*asus_edit*processor  # Left/Right cursor, Down at cursor, edit inside
    - lua_processor@*asus_keys  # Ctrl+Space, compact menu keys, Space / BackSpace
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - fluency_editor
  segmentors:
    - lua_segmentor@*asus_english*segmentor  # English mode: one English segment
    - ascii_segmentor
    - matcher
    - lua_segmentor@*asus_lang*segmentor  # Chinese/English/stray-key spans
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - lua_translator@*asus_symbols*translator
    - lua_translator@*asus_shortcuts  # rime/shortcuts.txt
    - lua_translator@*asus_lang*translator  # English words, dropped stray keys
    - lua_translator@*asus_typo*translator  # keys that are no syllable (typo)
    - lua_translator@*asus_edit*translator  # locks the text before the editing cursor
    - script_translator
  filters:
    - simplifier@zh_hans
    - simplifier@zh_hant_tw
    - uniquifier
    - lua_filter@*asus_typo*filter  # a key typed one key off (ㄈ->ㄌ), by sentence weight
    - lua_filter@*asus_lang*context  # Chinese next to a number, converted with it as context
    - lua_filter@*asus_tw  # Taiwan spellings: 宕機 -> 當機, 坐標 -> 座標
    - lua_filter@*asus_grammar  # 的/得/地, 在/再 context rules
    - lua_filter@*asus_learn*filter  # learned corrections (after the rules)
    - lua_filter@*asus_lang*digits  # 204 -> 但, digits second
    - lua_filter@*asus_edit*filter  # text after the editing cursor stays as it was
    - lua_filter@*asus_compact  # must stay last

# Half-width mode (the default, as in ASUS Smart Input) types ASCII ( ) ? ! :
# directly, without a menu; full-width （）？！： stay on Ctrl+Shift+9/0, /,
# 1, ; and the ` keyboard. Patched (replaced) rather than merged: the stock
# values are scalars or lists.
__patch:
  - "punctuator/half_shape/(": { commit: "(" }
    "punctuator/half_shape/)": { commit: ")" }
    "punctuator/half_shape/?": { commit: "?" }
    "punctuator/half_shape/!": { commit: "!" }
    "punctuator/half_shape/:": { commit: ":" }
    # Next-word prediction / autocomplete (lua/asus_predict.lua), on by default.
    "switches/+":
      - name: prediction
        reset: 1
        states: [ 預測關, 預測開 ]
  - asus_zhuyin.custom:/patch?

recognizer:
  patterns:
    asus_symbol: "^`$"
    reverse_lookup: "(?!)"  # stroke reverse lookup removed; ` opens symbols
    uppercase: "(?!)"  # capitals are handled as English by asus_lang.lua

menu:
  page_size: 9
  # Digits are Zhuyin keys, so the selector must never consume them; selection
  # by 1-9 is done in asus_keys.lua only while the menu is expanded. These
  # non-ASCII placeholders can never match a key, which also stops Shift+letter
  # from selecting candidates. Labels shown in the candidate window are 1-9.
  alternative_select_keys: "①②③④⑤⑥⑦⑧⑨"
  alternative_select_labels: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

translator:
  # terra_pinyin + Taiwan MOE supplement + personal words (tools/build_lexicon.py).
  # Learned data stays in terra_pinyin.userdb.
  dictionary: terra_pinyin.asus
  prism: asus_zhuyin
  # librime's keyboard-adjacency corrector stays off: on the eval set it cut
  # clean-sentence accuracy from 76% to 54% (it "corrects" valid input) while
  # only lifting typo sentences from 0% to 22%. Typo handling is done in Lua
  # instead, only when the input is not valid Zhuyin (stage 3).
  enable_correction: false

# Symbol keyboard for ` (lua/asus_symbols.lua). Each item is "<key><symbol>",
# items separated by spaces; uppercase / shifted keys are typed with Shift.
# Item order is the display order. "一般" uses the ASUS Smart Input key
# mapping, listed with the most common punctuation first.
asus_symbols:
  categories:
    - name: 一般
      layout: ',， .。 ''、 ;； l： x？ z！ g「 h」 j『 k』 o（ p）
