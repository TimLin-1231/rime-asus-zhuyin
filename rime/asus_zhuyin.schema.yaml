        `｀ 1１ 2２ 3３ 4４ 5５ 6６ 7７ 8８ 9９ 0０'
    - name: 數學
      layout: '`≈ 1∑ 2∏ 3∫ 4∂ 5∇ 6∞ 7√ 8× 9∈ 0∉ -± =≠
        qθ wω eε rρ tτ yψ uυ iι oο pπ [⊆ ]⊇ \∖
        aα sσ dδ fφ gγ hη jξ kκ lλ ;∴ ''′
        zζ xχ c∠ v∨ bβ nν mμ ,≤ .≥ /÷
        !¬ @² #³ $∀ %‰ ^∃ &∧ *· (⊂ )⊃ _∓ :∵ "″ <≪ >≫ ?≅ {∪ }∩ |∥ ~∼
        QΘ WΩ DΔ SΣ FΦ GΓ LΛ PΠ CΨ XΞ'
    - name: 特殊
      layout: '`※ 1① 2② 3③ 4④ 5⑤ 6⑥ 7⑦ 8⑧ 9⑨ 0⑩ -─ =═
        q↖ w↑ e↗ r★ t☆ y℃ u℉ i© o® p™ [§ ]¶ \†
        a← s↓ d→ f♥ g♡ h㎡ j㎏ k㎝ l㎞ ;◎ ''△
        z↙ x↔ c↘ v✓ b✗ n㎜ m♪ ,‧ .• /↕
        !▲ @▼ #◆ $◇ %■ ^□ &● *○ <⇐ >⇒ ?⇔ ~～'
