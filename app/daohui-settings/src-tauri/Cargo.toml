[package]
name = "daohui-settings"
version = "0.1.0"
description = "島輝 設定與更新"
authors = ["TimLin-1231"]
license = "GPL-3.0-or-later"
repository = "https://github.com/TimLin-1231/rime-asus-zhuyin"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls = SChannel on Windows, Security.framework on macOS (no OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
roxmltree = "0.20"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "fs", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
